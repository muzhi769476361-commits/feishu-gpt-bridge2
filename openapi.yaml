openapi: 3.1.0
info:
  title: A独角兽综合群消息查询
  version: 2.0.0
  description: 按最新、最近若干小时或指定时间范围查询已采集的飞书群消息。
servers:
  - url: https://feishu-gpt-bridge2.onrender.com
paths:
  /get-messages:
    get:
      operationId: get_feishu_messages
      summary: 按群消息时间查询A独角兽综合群消息
      description: |
        时间使用 ISO 8601。北京时间示例：2026-09-17T09:00:00+08:00。
        查询“最近N小时”时传 hours；区间终点自动取该群最后一条已采集消息的 event_time，
        而不是当前系统时间。查询指定区间时传 start_time 和 end_time。
        如果 has_more 为 true，使用 next_before_id 继续查询更早的一页。
        返回的 latest_messages 按群消息时间升序排列，最后一项为该查询范围内最新的已采集消息；
        不要把 API 查询时间 observed_at 当作群消息时间。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: group_name
          in: query
          required: false
          schema:
            type: string
            default: A独角兽综合群
        - name: hours
          in: query
          required: false
          description: 查询最近多少小时，可使用小数；与 start_time 同时提供时优先使用 start_time。
          schema:
            type: number
            minimum: 0.01
            maximum: 8784
        - name: start_time
          in: query
          required: false
          description: 起始时间，包含该时刻；不带时区时按 Asia/Shanghai 处理。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          description: 结束时间，包含该时刻；仅传 hours 而不传本字段时，自动取该群最后一条已采集消息的时间。
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: 每页消息数，最多500条。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before_id
          in: query
          required: false
          description: 分页游标，填写上一页返回的 next_before_id。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: string
                  count:
                    type: integer
                  latest_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        content:
                          type: string
                          description: 消息正文；图片消息会附带“图片文字识别”结果。
                        event_time:
                          type: string
                          format: date-time
                          description: 群消息时间；判断“最新”应使用此字段。
                        received_at:
                          type: string
                          format: date-time
                          description: 数据入库时间，不代表群消息发布时间。
                        image_count:
                          type: integer
                          description: 此消息包含的图片数量。
                        image_ocr:
                          type: string
                          description: 图片识别出的文字；为空时不得臆测图片内容。
                      additionalProperties: true
                  range:
                    type: object
                    properties:
                      anchor:
                        type:
                          - string
                          - "null"
                        description: hours 自动取最后一条群消息时为 latest_group_message。
                      anchor_message_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                      start_time:
                        type:
                          - string
                          - "null"
                        format: date-time
                      end_time:
                        type:
                          - string
                          - "null"
                        format: date-time
                  observed_at:
                    type: string
                    format: date-time
                    description: API 本次查询时间，不等于群消息产生时间。
                  collector:
                    type: object
                    description: 云端短周期增量同步状态；is_running 为 false 时不得把旧消息称为实时消息。
                    properties:
                      mode:
                        type: string
                        description: scheduled_incremental 表示定时启动、完成即退出。
                      is_running:
                        type: boolean
                      sync_status:
                        type:
                          - string
                          - "null"
                      last_sync_success_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                      seconds_since_sync_success:
                        type:
                          - integer
                          - "null"
                      last_seen_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                      seconds_since_heartbeat:
                        type:
                          - integer
                          - "null"
                      dom_message_count:
                        type:
                          - integer
                          - "null"
                  has_more:
                    type: boolean
                  next_before_id:
                    type:
                      - integer
                      - "null"
        "400":
          description: 时间范围格式错误
        "401":
          description: API Key 错误
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
